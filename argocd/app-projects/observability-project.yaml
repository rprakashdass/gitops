apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: observability
  namespace: argocd
spec:
  description: Observability applications
  sourceRepos:
    - 'https://github.com/rprakashdass/gitops.git'
    - 'https://grafana.github.io/helm-charts'      # Grafana, Loki, Mimir
    - 'https://prometheus-community.github.io/helm-charts'  # Prometheus
    - 'https://charts.min.io/'                     # MinIO
  destinations:
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'