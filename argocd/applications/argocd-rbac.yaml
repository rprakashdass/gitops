apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-rbac
  namespace: argocd
spec:
  project: default
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc

  source:
    repoURL: https://github.com/rprakashdass/gitops.git
    targetRevision: main
    path: argocd/rbac

  syncPolicy:
    automated:
      prune: false
      selfHeal: true