{{- if .Values.apps.posSystem.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pos-system
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: springboot-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: pos-dev
  sources:
    - repoURL: {{ .Values.global.repoURL }}
      targetRevision: {{ .Values.global.targetRevision }}
      path: springboot-apps/pos/pos-system
      helm:
        valueFiles:
          - base-values.yaml
          - values-dev.yaml
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
{{- end }}
