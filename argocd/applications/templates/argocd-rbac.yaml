{{- if .Values.apps.argoCdRbac.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-rbac
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/rprakashdass/gitops.git
    targetRevision: local-server
    path: argocd/rbac
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
{{- end }}
