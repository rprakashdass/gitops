apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
spec:
  project: observability
  destination:
    namespace: monitoring
    server: https://kubernetes.default.svc

  sources:
    # Official Grafana Alloy Helm chart
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 0.12.*
      helm:
        releaseName: alloy
        valueFiles:
          - $values/platform/observability/alloy/values.yaml

    # Our Git repo with values and ConfigMap template
    - repoURL: https://github.com/rprakashdass/gitops.git
      targetRevision: main
      ref: values

  syncPolicy:
    automated:
      prune: false
      selfHeal: true