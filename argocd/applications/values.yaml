# App-of-Apps values — single source of truth for every ArgoCD Application.
#
# Each entry becomes one ArgoCD Application (see templates/applications.yaml).
# Toggle experiments on/off with `enabled: true|false` — this is the seam for
# "experiment with lots of things": add a block, flip enabled, commit.
#
# Repo/branch below are the DEFAULTS inherited by every app. Override per-app
# with `repoURL:` / `targetRevision:` — e.g. to pull homelab apps from a
# separate `homelab-gitops` repo without touching anything else here.

repository:
  url: https://github.com/rprakashdass/gitops.git
  branch: main

deploymentNamespace: monitoring
argocdNamespace: argocd
argocdProject: observability

applications:
  # ─────────────────────────────────────────────────────────────
  # Observability (Grafana stack) — project: observability
  # ─────────────────────────────────────────────────────────────
  alloy:
    enabled: true
    description: "Grafana Alloy — OpenTelemetry collector and log shipper"
    project: observability
    namespace: monitoring
    syncWave: "1"
    prune: false
    path: platform/observability/alloy
    helm:
      valueFiles:
        - values.yaml

  grafana:
    enabled: true
    description: "Grafana dashboards and visualization"
    project: observability
    namespace: monitoring
    syncWave: "1"
    autoSync: false
    useExternalChart: true
    externalChart:
      repoURL: https://grafana.github.io/helm-charts
      chart: grafana
      targetRevision: 10.5.15
      valueFile: platform/observability/grafana/values.yaml

  loki:
    enabled: true
    description: "Loki log aggregation"
    project: observability
    namespace: monitoring
    syncWave: "1"
    prune: false
    useExternalChart: true
    externalChart:
      repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 6.29.0
      valueFile: platform/observability/loki/values.yaml

  mimir:
    enabled: true
    description: "Mimir distributed metrics storage"
    project: observability
    namespace: monitoring
    syncWave: "1"
    prune: false
    useExternalChart: true
    externalChart:
      repoURL: https://grafana.github.io/helm-charts
      chart: mimir-distributed
      targetRevision: 3.0.x
      valueFile: platform/observability/mimir/values.yaml

  tempo:
    enabled: true
    description: "Tempo distributed tracing"
    project: observability
    namespace: monitoring
    syncWave: "1"
    prune: false
    useExternalChart: true
    externalChart:
      repoURL: https://grafana.github.io/helm-charts
      chart: tempo
      targetRevision: "1.3.0"
      valueFile: platform/observability/tempo/values.yaml

  minio:
    enabled: true
    description: "MinIO S3-compatible object storage"
    project: observability
    namespace: monitoring
    syncWave: "1"
    prune: false
    useExternalChart: true
    externalChart:
      repoURL: https://charts.min.io/
      chart: minio
      targetRevision: 5.*
      valueFile: platform/observability/minio/values.yaml

  alerting-config:
    enabled: true
    description: "Alerting rules, Alertmanager config, and contact points"
    project: observability
    namespace: monitoring
    syncWave: "1"
    prune: true
    sources:
      - repoURL: https://github.com/rprakashdass/gitops.git
        targetRevision: main
        path: platform/observability/alerting
        helm:
          valueFiles:
            - values.yaml
      - repoURL: https://github.com/rprakashdass/gitops.git
        targetRevision: main
        path: platform/alerting/global
        directory:
          recurse: false
      - repoURL: https://github.com/rprakashdass/gitops.git
        targetRevision: main
        path: platform/alerting/production
        directory:
          recurse: false

  # ─────────────────────────────────────────────────────────────
  # Networking / cluster config
  # ─────────────────────────────────────────────────────────────
  platform-ingress:
    enabled: true
    description: "Platform Ingress routing rules"
    project: observability
    namespace: monitoring
    syncWave: "1"
    prune: false
    path: platform
    directory:
      include: "ingress.yaml"

  argocd-rbac:
    enabled: true
    description: "ArgoCD RBAC configuration"
    project: default
    namespace: argocd
    syncWave: "0"
    prune: false
    path: argocd/rbac

  vpa:
    enabled: false
    description: "Vertical Pod Autoscaler"
    project: default
    namespace: kube-system
    syncWave: "-1"
    prune: false
    useExternalChart: true
    externalChart:
      repoURL: https://charts.fairwinds.com/stable
      chart: vpa
      targetRevision: "4.11.0"
      values: |
        recommender:
          enabled: true
        updater:
          enabled: false
        admissionController:
          enabled: true

  # ─────────────────────────────────────────────────────────────
  # Spring Boot demo workloads — project: springboot-apps
  # ─────────────────────────────────────────────────────────────
  pos-system:
    enabled: true
    description: "POS System — dev environment"
    project: springboot-apps
    namespace: pos-dev
    syncWave: "1"
    autoSync: false
    sources:
      - repoURL: https://github.com/rprakashdass/gitops.git
        targetRevision: main
        ref: values
      - repoURL: https://github.com/rprakashdass/gitops.git
        targetRevision: main
        path: springboot-apps
        helm:
          valueFiles:
            - $values/springboot-apps/values-dev.yaml

  pos-system-prod:
    enabled: false
    description: "POS System — production environment"
    project: springboot-apps
    namespace: pos-prod
    syncWave: "1"
    autoSync: false
    sources:
      - repoURL: https://github.com/rprakashdass/gitops.git
        targetRevision: main
        ref: values
      - repoURL: https://github.com/rprakashdass/gitops.git
        targetRevision: main
        path: springboot-apps
        helm:
          valueFiles:
            - $values/springboot-apps/values-prod.yaml

  # ─────────────────────────────────────────────────────────────
  # Homelab services — project: home, namespace: home
  # Built by .github/workflows/build-and-push.yml (services/**) → ghcr.io.
  # DISABLED until the first CI build publishes each image; flip to true
  # once the image exists. To serve these from a separate repo instead,
  # add `repoURL:`/`targetRevision:` pointing at homelab-gitops.
  # ─────────────────────────────────────────────────────────────
  telegram-bot:
    enabled: false
    description: "Centralized Telegram bot for messaging and commands"
    project: home
    namespace: home
    syncWave: "0"
    path: services/messaging/telegram-bot

  hello-world:
    enabled: false
    description: "Daily heartbeat logger — self-built CI/CD, notifies via telegram-bot"
    project: home
    namespace: home
    syncWave: "1"
    path: services/automation/hello-world
