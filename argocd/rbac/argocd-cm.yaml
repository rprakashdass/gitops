apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  application.instanceLabelKey: argocd.argoproj.io/instance
  application.resourceTrackingMethod: annotation
  admin.enabled: "false"

  accounts.admin: login
  accounts.dev: login
  accounts.prakash: login

  timeout.reconciliation: 300s