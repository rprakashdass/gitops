apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://github.com/rprakashdass/gitops.git
      targetRevision: main
      path: argocd
      directory:
        recurse: true
        exclude: 'applications/**'
    - repoURL: https://github.com/rprakashdass/gitops.git
      targetRevision: main
      path: argocd/applications
      helm:
        releaseName: argocd-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true