# ArgoCD Helm Chart Values
# Official chart: https://github.com/argoproj/argo-helm

global:
  domain: argocd.rprakashdass.in

server:
  insecure: true

  service:
    port: 80

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: argocd.rprakashdass.in
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Controller configuration
controller:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

repoServer:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

redis:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi
    
# Dex (SSO)
dex:
  enabled: false

# Application Set Controller
applicationSet:
  enabled: true

# Notifications Controller
notifications:
  enabled: false

configs:
  params:
    server.insecure: true
