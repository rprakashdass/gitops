# Replaces secrets/telegram-bot-secrets.enc.yaml (SOPS).
# The VALUES live only in Vault. This file just declares which keys to pull
# and into what Secret. Seed Vault once with:
#   vault kv put secret/telegram \
#     TELEGRAM_BOT_TOKEN=xxxx TELEGRAM_CHAT_ID=yyyy
#
# NOTE: the consumer (telegram-bot) lives in homelab-gitops; ideally this
# ExternalSecret moves there next to the bot. Kept here as a working example.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: telegram-bot-secrets
  namespace: home
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: telegram-bot-secrets   # the K8s Secret ESO creates/owns
    creationPolicy: Owner
  data:
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: telegram
        property: TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_CHAT_ID
      remoteRef:
        key: telegram
        property: TELEGRAM_CHAT_ID
