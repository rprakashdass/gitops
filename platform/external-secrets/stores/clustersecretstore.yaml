# Cluster-wide binding: how ESO talks to Vault.
# Auth is Kubernetes auth — ESO presents its ServiceAccount token, Vault's
# `kubernetes` auth backend validates it and maps it to the `external-secrets`
# role/policy. No static Vault token in git.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc:8200"
      path: "secret"        # KV v2 mount
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
