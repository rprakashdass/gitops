# Langfuse — LLM observability platform
# Self-hosted: all data stays in-cluster
# PostgreSQL and Redis are deployed as separate Argo CD apps

replicaCount: 1

image:
  repository: langfuse/langfuse
  tag: "2"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 3000

ingress:
  enabled: true
  className: traefik
  host: langfuse.local

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1000m"
    memory: "2Gi"

# External database connections (deployed as separate apps)
config:
  DATABASE_URL: "postgresql://langfuse:langfuse@postgresql.ollama.svc.cluster.local:5432/langfuse"
  REDIS_HOST: "redis.ollama.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "redis"
  NEXTAUTH_SECRET: "change-me-to-a-random-string"
  NEXTAUTH_URL: "http://langfuse.local"
  SALT: "change-me-to-a-random-string"
  TELEMETRY_ENABLED: "false"
  ENABLE_EXPERIMENTAL_FEATURES: "false"

persistence:
  enabled: true
  size: 2Gi
  storageClass: local-path
