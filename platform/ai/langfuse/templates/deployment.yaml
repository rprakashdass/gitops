apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "langfuse.fullname" . }}
  labels:
    {{- include "langfuse.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "langfuse.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "langfuse.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: langfuse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "langfuse.fullname" . }}-config
                  key: DATABASE_URL
            - name: REDIS_HOST
              value: {{ .Values.config.REDIS_HOST | quote }}
            - name: REDIS_PORT
              value: {{ .Values.config.REDIS_PORT | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "langfuse.fullname" . }}-config
                  key: REDIS_PASSWORD
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "langfuse.fullname" . }}-config
                  key: NEXTAUTH_SECRET
            - name: NEXTAUTH_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "langfuse.fullname" . }}-config
                  key: NEXTAUTH_URL
            - name: SALT
              valueFrom:
                secretKeyRef:
                  name: {{ include "langfuse.fullname" . }}-config
                  key: SALT
            - name: TELEMETRY_ENABLED
              valueFrom:
                secretKeyRef:
                  name: {{ include "langfuse.fullname" . }}-config
                  key: TELEMETRY_ENABLED
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/public/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
