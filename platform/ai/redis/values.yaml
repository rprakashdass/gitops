# Redis for Langfuse — deployed as separate Argo CD app
auth:
  password: redis

master:
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

service:
  type: ClusterIP
  port: 6379
