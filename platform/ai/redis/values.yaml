# Redis for Langfuse — deployed as separate Argo CD app
image:
  repository: bitnami/redis
  tag: "7.4.1-debian-12-r0"
  pullPolicy: IfNotPresent

auth:
  password: redis

master:
  persistence:
    enabled: true
    storageClass: local-path
    size: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "250m"
      memory: "512Mi"

service:
  type: ClusterIP
  port: 6379
