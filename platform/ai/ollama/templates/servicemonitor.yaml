{{- if .Values.metrics.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "ollama.fullname" . }}
  labels:
    {{- include "ollama.labels" . | nindent 4 }}
    release: prometheus
spec:
  selector:
    matchLabels:
      {{- include "ollama.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: http
      path: /api/metrics
      interval: 15s
      scrapeTimeout: 10s
{{- end }}
