knative:
  enabled: false

replicaCount: 1

ollama:
  models:
    pull: [qwen2.5:7b]
    run: [qwen2.5:7b]
    create: []

ingress:
  enabled: true
  className: traefik

# Prefer the lighter-loaded worker node (more free memory, master is already 48% used)
nodeSelector: {}
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s.worker.1

resources:
  requests:
    cpu: "2000m"
    memory: "6Gi"
  limits:
    cpu: "4000m"
    memory: "7500Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3

persistentVolume:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-path"
  size: 20Gi

extraEnv:
  - name: OLLAMA_KEEP_ALIVE
    value: "10m"
  # Privacy: disable all telemetry/analytics
  - name: OLLAMA_TELEMETRY
    value: "0"
  - name: OLLAMA_ORIGINS
    value: "http://localhost:11434"

# Metrics: expose Prometheus-compatible metrics for Grafana
metrics:
  enabled: true
  port: 11434
  path: /api/metrics
