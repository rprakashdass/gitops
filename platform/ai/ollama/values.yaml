knative:
  enabled: false

replicaCount: 1

ollama:
  models:
    pull: [llama3.2:3b]
    run: [llama3.2:3b]
    create: []

ingress:
  enabled: true
  className: traefik

# Prefer the lighter-loaded worker node (more free memory, master is already 48% used)
nodeSelector: {}
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s.worker.1

resources:
  requests:
    cpu: "1500m"
    memory: "3Gi"
  limits:
    cpu: "3000m"
    memory: "5Gi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3

persistentVolume:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-path"
  size: 20Gi

extraEnv:
  - name: OLLAMA_KEEP_ALIVE
    value: "10m"