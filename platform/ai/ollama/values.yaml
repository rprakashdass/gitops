knative:
  enabled: false

replicaCount: 1

ollama:
  models:
    pull: [llama3.2:1b]
    run: [llama3.2:1b]
    create: []

ingress:
  enabled: true
  className: traefik

resources:
  requests:
    cpu: "2500m"
    memory: "2536Mi"
  limits:
    cpu: "4500m"
    memory: "6048Mi"

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3

persistentVolume:
  enabled: true
  accessModes:
    - ReadWriteOnce
  storageClassName: "local-path"
  size: 30Gi

extraEnv:
  - name: OLLAMA_KEEP_ALIVE
    value: "1m"