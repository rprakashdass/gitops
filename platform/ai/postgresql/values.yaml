# PostgreSQL for Langfuse — deployed as separate Argo CD app
image:
  repository: bitnami/postgresql
  tag: "17.2.0-debian-12-r0"
  pullPolicy: IfNotPresent

auth:
  username: langfuse
  password: langfuse
  database: langfuse

primary:
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

service:
  type: ClusterIP
  port: 5432
