rabbitmq-cluster-operator:
  commonLabels:
    purpose: "message-queue-operator"

  useCertManager: false        # avoids a hard cert-manager dependency

  # Broadcom pruned these exact tags from the free bitnami/* Docker Hub namespace
  # (moved to bitnamilegacy/*, same tag) — chart's shipped defaults still point at
  # bitnami/*, which now 404s. Override both operator images to the legacy path.
  msgTopologyOperator:
    enabled: true               # bundles the Topology Operator too
    image:
      repository: bitnamilegacy/rmq-messaging-topology-operator

  clusterOperator:
    image:
      repository: bitnamilegacy/rabbitmq-cluster-operator
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi

  # Operator-wide default broker image, used for any RabbitmqCluster CR that doesn't
  # set spec.image itself. Same bitnami -> bitnamilegacy pruning as the operator images above.
  rabbitmqImage:
    repository: bitnamilegacy/rabbitmq