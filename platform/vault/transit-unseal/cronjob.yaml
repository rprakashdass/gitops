# Auto-unseal for the transit Vault.
#
# Shamir-sealed Vaults start sealed on every process start (node reboot, pod
# reschedule, chart rollout). The transit Vault is the root of trust, so its
# unseal key is NOT in git. Create the Secret out-of-band first:
#
#   kubectl -n vault create secret generic vault-transit-unseal-key \
#     --from-literal=unseal-key=<transit-unseal-key>
#
# This CronJob is idempotent: unsealing an already-unsealed Vault exits 0.
# It retries for ~60s per run so it also works when the pod is still starting.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: vault-transit-unseal
  namespace: vault
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 30
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 90
      ttlSecondsAfterFinished: 60
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: unseal
              image: hashicorp/vault:1.17.6
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  for i in $(seq 1 30); do
                    if vault operator unseal -address="$VAULT_ADDR" "$VAULT_UNSEAL_KEY"; then
                      exit 0
                    fi
                    sleep 2
                  done
                  echo "unseal did not succeed after 60s (vault not ready, uninitialized, or key wrong)" >&2
                  exit 1
              env:
                - name: VAULT_ADDR
                  value: http://vault-transit.vault.svc:8200
                - name: VAULT_UNSEAL_KEY
                  valueFrom:
                    secretKeyRef:
                      name: vault-transit-unseal
                      key: token
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 64Mi
