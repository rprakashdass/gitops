# Main Vault — holds your actual secrets (KV v2 @ secret/).
# Standalone + file storage on a PVC (survives restarts).
# Auto-unseals against the TRANSIT vault via a `seal "transit"` stanza whose
# address/key/mount come from env vars, and whose TOKEN is injected from a
# Kubernetes Secret (vault-transit-unseal) that you create during bootstrap —
# so no token ever lives in git.
global:
  enabled: true

injector:
  enabled: false

server:
  image:
    tag: "1.17.6"

  dataStorage:
    enabled: true
    size: 2Gi

  # Non-secret transit-seal settings (key / mount path — VAULT_TRANSIT_SEAL_*
  # prefix only applies to these two; address/token use plain VAULT_ADDR /
  # VAULT_TOKEN per https://developer.hashicorp.com/vault/docs/configuration/seal/transit,
  # so address is set inline in the seal stanza below instead).
  extraEnvironmentVars:
    VAULT_TRANSIT_SEAL_KEY_NAME: "autounseal"
    VAULT_TRANSIT_SEAL_MOUNT_PATH: "transit/"

  # The transit token — injected from a K8s Secret you create at bootstrap:
  #   kubectl -n vault create secret generic vault-transit-unseal \
  #     --from-literal=token=<transit-token>
  # Maps to VAULT_TOKEN (not VAULT_TRANSIT_SEAL_TOKEN) — that's the env var
  # the transit seal's `token` param actually reads.
  extraSecretEnvironmentVars:
    - envName: VAULT_TOKEN
      secretName: vault-transit-unseal
      secretKey: token

  standalone:
    enabled: true
    config: |
      ui = true
      listener "tcp" {
        address     = "[::]:8200"
        tls_disable = 1
      }
      storage "file" {
        path = "/vault/data"
      }
      # Auto-unseal via the transit vault. key_name/mount_path come from
      # VAULT_TRANSIT_SEAL_* env vars above; token comes from VAULT_TOKEN.
      seal "transit" {
        address = "http://vault-transit.vault.svc:8200"
      }

  ui:
    enabled: true

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      kubernetes.io/ingress.class: traefik
    hosts:
      - host: vault.local
        paths:
          - /
    tls: []

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
