apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-contact-points
  namespace: monitoring
data:
  contact-points.yaml: |
    receivers:
    - name: 'slack-notifications'
      slack_configs:
      - channel: '#alerts'
        send_resolved: true
        api_url_file: /etc/alertmanager/secrets/slack_url
        title: '[{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ len .Alerts.Firing }}{{ end }}] {{ .CommonLabels.alertname }}'
        text: |
          {{ range .Alerts -}}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Details:*
            {{ range .Labels.SortedPairs }}• *{{ .Name }}:* `{{ .Value }}`
            {{ end }}
          {{- end }}
    - name: 'null'
