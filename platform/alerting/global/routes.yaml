apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-routes
  namespace: monitoring
data:
  routes.yaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: 'null'
      group_by: ['alertname', 'cluster', 'service']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
      - receiver: 'slack-notifications'
        matchers:
        - severity =~ "warning|critical"
