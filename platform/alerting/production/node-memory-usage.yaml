apiVersion: v1
kind: ConfigMap
metadata:
  name: rule-node-memory-usage
  namespace: monitoring
  labels:
    app: mimir-rules
data:
  node-memory-usage.yaml: |
    groups:
    - name: node-memory-usage
      rules:
      - alert: NodeMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node memory usage is high on {{ $labels.instance }}"
          description: "Memory usage on node {{ $labels.instance }} has been above 85% for 5 minutes."
