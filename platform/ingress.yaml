apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress-subdomains
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    # Grafana
    - host: grafana.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                namespace: monitoring
                port:
                  number: 80
    
    # Prometheus
    - host: prometheus.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fake-metrics-prometheus-server
                namespace: monitoring
                port:
                  number: 80
    
    # Loki
    - host: loki.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: loki-gateway
                namespace: monitoring
                port:
                  number: 80
    
    # Mimir
    - host: mimir.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mimir-nginx
                namespace: monitoring
                port:
                  number: 80
    
    # MinIO Console
    - host: minio.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio-console
                namespace: monitoring
                port:
                  number: 9001
