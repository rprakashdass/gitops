apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-rules
  namespace: monitoring
data:
  kubernetes-alerts.yaml: |
    groups:
    - name: kubernetes-alerts
      rules:
      - alert: KubePodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[5m]) * 60 * 5 > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash looping"
          description: "Pod {{ $labels.pod }} is restarting frequently."

      - alert: KubeDeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has a replica mismatch"
          description: "The number of available replicas for deployment {{ $labels.deployment }} does not match the desired number."

  node-alerts.yaml: |
    groups:
    - name: node-alerts
      rules:
      - alert: NodeCPUUsage
        expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100)) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node CPU usage is high on {{ $labels.instance }}"
          description: "CPU usage on node {{ $labels.instance }} has been above 80% for 5 minutes."

      - alert: NodeMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Node memory usage is high on {{ $labels.instance }}"
          description: "Memory usage on node {{ $labels.instance }} has been above 85% for 5 minutes."
