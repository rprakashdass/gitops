groups:
- name: node-alerts
  rules:
  - alert: NodeCPUUsage
    expr: (100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100)) > 80
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Node CPU usage is high on {{ $labels.instance }}"
      description: "CPU usage on node {{ $labels.instance }} has been above 80% for 5 minutes."

  - alert: NodeMemoryUsage
    expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Node memory usage is high on {{ $labels.instance }}"
      description: "Memory usage on node {{ $labels.instance }} has been above 85% for 5 minutes."
