groups:
- name: kubernetes-alerts
  rules:
  - alert: KubePodCrashLooping
    expr: rate(kube_pod_container_status_restarts_total[5m]) * 60 * 5 > 0
    for: 1m
    labels:
      severity: critical
    annotations:
      summary: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} is crash looping"
      description: "Pod {{ $labels.pod }} is restarting frequently."

  - alert: KubeDeploymentReplicasMismatch
    expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
    for: 5m
    labels:
      severity: warning
    annotations:
      summary: "Deployment {{ $labels.deployment }} in namespace {{ $labels.namespace }} has a replica mismatch"
      description: "The number of available replicas for deployment {{ $labels.deployment }} does not match the desired number."
