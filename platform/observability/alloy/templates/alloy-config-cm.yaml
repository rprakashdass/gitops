apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: monitoring
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/managed-by: argocd
data:
  config.alloy: |
    // ==========================================
    // Grafana Alloy Configuration
    // Purpose: Collect logs from POS applications and monitoring stack
    // ==========================================

    // Discover Kubernetes pods in the 'pos' namespace
    discovery.kubernetes "pos_pods" {
      role = "pod"
      namespaces {
        names = ["pos"]
      }
    }

    // Discover pods in the 'monitoring' namespace
    discovery.kubernetes "monitoring_pods" {
      role = "pod"
      namespaces {
        names = ["monitoring"]
      }
    }

    // Scrape logs from POS application pods
    loki.source.kubernetes "pos_logs" {
      targets    = discovery.kubernetes.pos_pods.targets
      forward_to = [loki.process.add_labels.receiver]
    }

    // Scrape logs from monitoring stack pods
    loki.source.kubernetes "monitoring_logs" {
      targets    = discovery.kubernetes.monitoring_pods.targets
      forward_to = [loki.process.add_labels.receiver]
    }

    // Add useful labels and process logs
    loki.process "add_labels" {
      forward_to = [loki.write.loki_endpoint.receiver]

      // Extract and relabel important fields
      stage.label_drop {
        values = ["filename", "stream"]
      }

      // Try to parse Spring Boot plain text logs (current format)
      // Format: 2026-04-06T06:21:39.838Z  INFO 1 --- [app-name] [thread] logger : message
      stage.regex {
        expression = "^(?P<timestamp>\\S+)\\s+(?P<level>\\w+)\\s+.+?\\[(?P<app>[^\\]]+)\\]\\s+\\[(?P<thread>[^\\]]+)\\]\\s+(?P<logger>\\S+)\\s+:\\s+(?P<message>.+)$"
      }

      // Try to parse JSON logs (if configured later)
      stage.json {
        expressions = {
          level     = "level",
          timestamp = "timestamp",
          logger    = "logger",
          message   = "message",
        }
      }

      // Add extracted fields as labels (from either regex or JSON parsing)
      stage.labels {
        values = {
          level  = "level",
          logger = "logger",
          app    = "app",
        }
      }
    }

    // Write logs to Loki
    loki.write "loki_endpoint" {
      endpoint {
        url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"

        // Optional: Add basic auth if Loki requires it
        // basic_auth {
        //   username = "loki"
        //   password = "your-password"
        // }
      }
    }
