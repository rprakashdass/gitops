apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy-receiver
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.alloy: |
    // ==========================================
    // Grafana Alloy Receiver Configuration
    // Purpose: Receive OTLP telemetry from applications
    // ==========================================

    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        metrics = [otelcol.processor.k8sattributes.default.input]
        logs    = [otelcol.processor.k8sattributes.default.input]
        traces  = [otelcol.processor.k8sattributes.default.input]
      }
    }

    // ========== Enrich with Kubernetes Metadata ==========
    otelcol.processor.k8sattributes "default" {
      auth_type = "serviceAccount"
      passthrough = false
      extract {
        metadata = ["k8s.namespace.name", "k8s.pod.name", "k8s.node.name", "k8s.pod.uid", "k8s.deployment.name"]
      }
      pod_association = [
        {
          sources = [
            {
              from = "connection"
            },
          ]
        },
        {
          sources = [
            {
              from = "resource_attribute"
              name = "k8s.pod.ip"
            },
          ]
        },
      ]
      output {
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.batch.default.input]
        traces  = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      send_batch_size = 100
      timeout = "10s"
      output {
        metrics = [otelcol.processor.attributes.metrics.input]
        logs    = [otelcol.processor.attributes.logs.input]
        traces  = [otelcol.processor.attributes.traces.input]
      }
    }

    // ========== Add Standard Labels to Metrics ==========
    otelcol.processor.attributes "metrics" {
      action {
        key = "job"
        value = "service.name"
        action = "upsert"
      }
      action {
        key = "pod"
        value = "k8s.pod.name"
        action = "upsert"
      }
      action {
        key = "namespace"
        value = "k8s.namespace.name"
        action = "upsert"
      }
      action {
        key = "version"
        value = "service.version"
        action = "upsert"
      }
      action {
        key = "env"
        value = "dev"
        action = "insert"
      }
      output {
        metrics = [otelcol.exporter.prometheus.mimir.input]
      }
    }

    // ========== Add Standard Labels to Logs ==========
    otelcol.processor.attributes "logs" {
      action {
        key = "job"
        value = "service.name"
        action = "upsert"
      }
      action {
        key = "pod"
        value = "k8s.pod.name"
        action = "upsert"
      }
      action {
        key = "namespace"
        value = "k8s.namespace.name"
        action = "upsert"
      }
      action {
        key = "version"
        value = "service.version"
        action = "upsert"
      }
      action {
        key = "env"
        value = "dev"
        action = "insert"
      }
      output {
        logs = [otelcol.exporter.loki.default.input]
      }
    }

    // ========== Add Standard Labels to Traces ==========
    otelcol.processor.attributes "traces" {
      action {
        key = "job"
        value = "service.name"
        action = "upsert"
      }
      action {
        key = "pod"
        value = "k8s.pod.name"
        action = "upsert"
      }
      action {
        key = "namespace"
        value = "k8s.namespace.name"
        action = "upsert"
      }
      action {
        key = "version"
        value = "service.version"
        action = "upsert"
      }
      action {
        key = "env"
        value = "dev"
        action = "insert"
      }
      output {
        traces = [otelcol.exporter.otlphttp.tempo.input]
      }
    }

    otelcol.exporter.prometheus "mimir" {
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    otelcol.exporter.loki "default" {
      forward_to = [loki.write.loki_endpoint.receiver]
    }

    otelcol.exporter.otlphttp "tempo" {
      client {
        endpoint = "http://tempo.monitoring.svc.cluster.local:4318"
      }
    }

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir-nginx.monitoring.svc.cluster.local/api/v1/push"
      }
    }

    loki.write "loki_endpoint" {
      endpoint {
        url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
      }
    }

