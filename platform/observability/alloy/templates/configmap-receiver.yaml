apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy-receiver
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.alloy: |
    // ==========================================
    // Grafana Alloy Receiver Configuration
    // Purpose: Receive OTLP telemetry from applications
    // ==========================================

    otelcol.receiver.otlp "default" {
      grpc {
        endpoint = "0.0.0.0:4317"
      }
      http {
        endpoint = "0.0.0.0:4318"
      }
      output {
        metrics = [otelcol.processor.batch.default.input]
        logs    = [otelcol.processor.batch.default.input]
        traces = [otelcol.processor.batch.default.input]
      }
    }

    otelcol.processor.batch "default" {
      send_batch_size = 100
      timeout = "10s"
      output {
        metrics = [otelcol.exporter.prometheus.mimir.input]
        logs    = [otelcol.exporter.loki.default.input]
        traces  = [otelcol.exporter.otlphttp.tempo.input]
      }
    }

    otelcol.exporter.prometheus "mimir" {
      forward_to = [prometheus.remote_write.mimir.receiver]
    }

    otelcol.exporter.loki "default" {
      forward_to = [loki.write.loki_endpoint.receiver]
    }

    otelcol.exporter.otlphttp "tempo" {
      client {
        endpoint = "http://tempo.monitoring.svc.cluster.local:3100"
      }
    }

    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir-nginx.monitoring.svc.cluster.local/api/v1/push"
      }
    }

    loki.write "loki_endpoint" {
      endpoint {
        url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
      }
    }
