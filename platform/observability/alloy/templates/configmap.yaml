apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  config.alloy: |
    // ==========================================
    // Grafana Alloy Configuration
    // Purpose: Collect logs AND metrics from applications
    // ==========================================

    // ========== LOGS COLLECTION ==========

    // Discover ALL pods across multiple namespaces
    discovery.kubernetes "pods" {
      role = "pod"
      namespaces {
        names = ["pos", "pos-prod", "monitoring"]
      }
    }

    // Filter out storage/backend components
    discovery.relabel "filtered_pods" {
      targets = discovery.kubernetes.pods.targets

      // Drop storage layer pods (loki, mimir, minio)
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
        regex         = "loki|mimir|minio"
        action        = "drop"
      }

      // Also drop by pod name pattern as fallback
      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        regex         = "loki-.*|mimir-.*|minio-.*"
        action        = "drop"
      }
    }

    // Scrape logs from all filtered pods
    loki.source.kubernetes "app_logs" {
      targets    = discovery.relabel.filtered_pods.output
      forward_to = [loki.process.add_standard_labels.receiver]
    }

    // Add standard Kubernetes labels + parse logs
    loki.process "add_standard_labels" {
      forward_to = [loki.write.loki_endpoint.receiver]

      // Add standard Kubernetes labels
      stage.labels {
        values = {
          pod       = "__meta_kubernetes_pod_name",
          namespace = "__meta_kubernetes_namespace",
          job       = "__meta_kubernetes_pod_label_app_kubernetes_io_name",
          instance  = "__meta_kubernetes_pod_node_name",
          container = "__meta_kubernetes_pod_container_name",
        }
      }

      // Drop unnecessary internal labels
      stage.label_drop {
        values = ["filename", "stream"]
      }

      // Parse Spring Boot plain text logs
      stage.regex {
        expression = "^(?P<timestamp>\\S+)\\s+(?P<level>\\w+)\\s+.+?\\[(?P<app_name>[^\\]]+)\\]\\s+\\[(?P<thread>[^\\]]+)\\]\\s+(?P<logger>\\S+)\\s+:\\s+(?P<message>.+)$"
      }

      // Parse JSON logs (if configured)
      stage.json {
        expressions = {
          level     = "level",
          timestamp = "timestamp",
          logger    = "logger",
          message   = "message",
        }
      }

      // Add parsed fields as additional labels
      stage.labels {
        values = {
          level    = "level",
          logger   = "logger",
          app_name = "app_name",
        }
      }
    }

    // Write logs to Loki
    loki.write "loki_endpoint" {
      endpoint {
        url = "http://loki-gateway.monitoring.svc.cluster.local/loki/api/v1/push"
      }
    }

    // ========== METRICS COLLECTION ==========

    // Discover KSM (Kube-State-Metrics) service
    discovery.kubernetes "ksm" {
      role = "service"
      namespaces {
        names = ["monitoring"]
      }
      selectors {
        role  = "service"
        label = "app.kubernetes.io/name=ksm"
      }
    }

    // Scrape metrics from KSM
    prometheus.scrape "ksm_metrics" {
      targets = discovery.kubernetes.ksm.targets
      forward_to = [prometheus.relabel.add_cluster.receiver]

      scrape_interval = "30s"
      scrape_timeout  = "10s"
    }

    // Add cluster label and relabel
    prometheus.relabel "add_cluster" {
      forward_to = [prometheus.remote_write.mimir.receiver]

      // Add cluster name
      rule {
        target_label = "cluster"
        replacement  = "local"
      }

      // Keep only useful labels
      rule {
        source_labels = ["__name__"]
        regex         = "kube_.*"
        action        = "keep"
      }
    }

    // Write metrics to Mimir
    prometheus.remote_write "mimir" {
      endpoint {
        url = "http://mimir-nginx.monitoring.svc.cluster.local/api/v1/push"
        
        // Add headers if needed
        headers = {
          "X-Scope-OrgID" = "anonymous"
        }
      }
    }
