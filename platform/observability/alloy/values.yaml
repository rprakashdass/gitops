alloy:
  configMap:
    create: false  # Don't create default ConfigMap, use our custom one
    name: alloy-config  # Reference our ConfigMap from templates/
    key: config.alloy  # The key in the ConfigMap data
    enableReporting: false

rbac:
  create: true

serviceAccount:
  create: true

controller:
  type: "daemonset"  # Run on every node for efficient log collection
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            namespaces:
              - monitoring
            labelSelector:
              matchExpressions:
                - key: app
                  operator: Exists
            topologyKey: "kubernetes.io/hostname"
