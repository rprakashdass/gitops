alloy:
  configMap:
    enableReporting: false
    # Config is loaded from ConfigMap: templates/alloy-config-cm.yaml

rbac:
  create: true

serviceAccount:
  create: true

controller:
  type: "daemonset"  # Run on every node for efficient log collection
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            namespaces:
              - monitoring
            labelSelector:
              matchExpressions:
                - key: app
                  operator: Exists
            topologyKey: "kubernetes.io/hostname"
