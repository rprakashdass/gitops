alloy:
  configMap:
    create: false
    enableReporting: false

  rbac:
    create: true

  serviceAccount:
    create: true

  controller:
    type: "daemonset"
    affinity:
      podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              namespaces:
                - monitoring
              labelSelector:
                matchExpressions:
                  - key: app
                    operator: Exists
              topologyKey: "kubernetes.io/hostname"

# KSM (Kube-State-Metrics) configuration
ksm:
  prometheusScrape: false
  
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
  
  service:
    type: ClusterIP
    port: 8080
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "8080"
  
