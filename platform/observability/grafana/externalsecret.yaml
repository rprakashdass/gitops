apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana/admin
        property: username
    - secretKey: admin-password
      remoteRef:
        key: grafana/admin
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-clickhouse
  namespace: observability
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-clickhouse
    creationPolicy: Owner
  data:
    - secretKey: CLICKHOUSE_USER
      remoteRef:
        key: clickhouse/admin
        property: username
    - secretKey: CLICKHOUSE_PASSWORD
      remoteRef:
        key: clickhouse/admin
        property: password
