service:
  type: ClusterIP

# persistence:
#   enabled: true
#   storageClassName: standard
#   size: 3Gi

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 450m
    memory: 656Mi

adminUser: admin
adminPassword: ChangeMeStrong

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: kubernetes
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default
      - name: jvm
        orgId: 1
        folder: jvm
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/jvm
      - name: gatus
        orgId: 1
        folder: gatus
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/gatus

dashboards:
  default:
    kube-state-metrics-v2:
      gnetId: 13332
      revision: 12
      datasource: Mimir
    kubernetes-cluster-monitoring:
      gnetId: 15661
      revision: 2
      datasource: Mimir
  jvm:
    jvm-overview-opentelemetry:
      gnetId: 18812
      revision: 1
      datasource: Mimir
  gatus:
    gatus-uptime:
      json: |
        {
            "annotations": {
              "list": [
                {
                  "builtIn": 1,
                  "datasource": {
                    "type": "grafana",
                    "uid": "-- Grafana --"
                  },
                  "enable": true,
                  "hide": true,
                  "iconColor": "rgba(0, 211, 255, 1)",
                  "name": "Annotations & Alerts",
                  "type": "dashboard"
                }
              ]
            },
            "editable": true,
            "fiscalYearStartMonth": 0,
            "graphTooltip": 0,
            "id": 759,
            "links": [],
            "panels": [
              {
                "datasource": {
                  "type": "prometheus",
                  "uid": "MIMIR"
                },
                "fieldConfig": {
                  "defaults": {
                    "custom": {
                      "align": "auto",
                      "cellOptions": {
                        "type": "auto"
                      },
                      "filterable": true,
                      "inspect": false
                    },
                    "mappings": [],
                    "thresholds": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "green",
                          "value": 0
                        }
                      ]
                    }
                  },
                  "overrides": [
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "Status"
                      },
                      "properties": [
                        {
                          "id": "custom.align",
                          "value": "center"
                        },
                        {
                          "id": "custom.cellOptions",
                          "value": {
                            "mode": "basic",
                            "type": "color-background"
                          }
                        },
                        {
                          "id": "mappings",
                          "value": [
                            {
                              "options": {
                                "0": {
                                  "color": "#f4c2c2",
                                  "text": "DOWN"
                                },
                                "1": {
                                  "color": "#c5e6bf",
                                  "text": "UP"
                                }
                              },
                              "type": "value"
                            }
                          ]
                        }
                      ]
                    },
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "Expiry"
                      },
                      "properties": [
                        {
                          "id": "unit",
                          "value": "dtdurations"
                        },
                        {
                          "id": "thresholds",
                          "value": {
                            "mode": "absolute",
                            "steps": [
                              {
                                "color": "red",
                                "value": 0
                              },
                              {
                                "color": "orange",
                                "value": 604800
                              },
                              {
                                "color": "green",
                                "value": 2592000
                              }
                            ]
                          }
                        }
                      ]
                    },
                    {
                      "matcher": {
                        "id": "byName",
                        "options": "Uptime %"
                      },
                      "properties": [
                        {
                          "id": "unit",
                          "value": "percent"
                        },
                        {
                          "id": "min",
                          "value": 0
                        },
                        {
                          "id": "max",
                          "value": 100
                        },
                        {
                          "id": "decimals",
                          "value": 2
                        },
                        {
                          "id": "color",
                          "value": {
                            "mode": "thresholds"
                          }
                        },
                        {
                          "id": "thresholds",
                          "value": {
                            "mode": "absolute",
                            "steps": [
                              {
                                "color": "#d32f2f",
                                "value": null
                              },
                              {
                                "color": "#d32f2f",
                                "value": 0
                              },
                              {
                                "color": "#e6a23c",
                                "value": 0.0001
                              },
                              {
                                "color": "#6ea86e",
                                "value": 99.9
                              }
                            ]
                          }
                        },
                        {
                          "id": "custom.width",
                          "value": 220
                        },
                        {
                          "id": "custom.cellOptions",
                          "value": {
                            "mode": "basic",
                            "type": "gauge"
                          }
                        }
                      ]
                    }
                  ]
                },
                "gridPos": {
                  "h": 30,
                  "w": 24,
                  "x": 0,
                  "y": 0
                },
                "id": 1,
                "options": {
                  "cellHeight": "md",
                  "footer": {
                    "countRows": false,
                    "fields": "",
                    "reducer": ["sum"],
                    "show": false
                  },
                  "showHeader": true
                },
                "pluginVersion": "12.1.1",
                "targets": [
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "MIMIR"
                    },
                    "expr": "gatus_results_endpoint_success{group=\"$group\"}",
                    "format": "table",
                    "instant": true,
                    "refId": "Status"
                  },
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "MIMIR"
                    },
                    "editorMode": "code",
                    "expr": "gatus_results_certificate_expiration_seconds{group=\"$group\"}",
                    "format": "table",
                    "instant": true,
                    "refId": "Expiry"
                  },
                  {
                    "datasource": {
                      "type": "prometheus",
                      "uid": "MIMIR"
                    },
                    "expr": "avg_over_time(gatus_results_endpoint_success{group=\"$group\"}[$__range]) * 100",
                    "format": "table",
                    "instant": true,
                    "refId": "Uptime"
                  }
                ],
                "title": "Service Health & SSL Status",
                "transformations": [
                  {
                    "id": "seriesToColumns",
                    "options": {
                      "byField": "key"
                    }
                  },
                  {
                    "id": "organize",
                    "options": {
                      "excludeByName": {
                        "Time": true,
                        "Time 2": true,
                        "Time 3": true,
                        "__name__": true,
                        "cluster 1": true,
                        "cluster 2": true,
                        "cluster 3": true,
                        "env 1": true,
                        "env 2": true,
                        "env 3": true,
                        "exporter 1": true,
                        "exporter 2": true,
                        "exporter 3": true,
                        "group 2": true,
                        "group 3": true,
                        "instance 1": true,
                        "instance 2": true,
                        "instance 3": true,
                        "job 1": true,
                        "job 2": true,
                        "job 3": true,
                        "key": true,
                        "name 1": false,
                        "name 2": true,
                        "name 3": true,
                        "pod 1": true,
                        "pod 2": true,
                        "pod 3": true,
                        "source 1": true,
                        "source 2": true,
                        "source 3": true,
                        "type 1": true,
                        "type 2": true,
                        "type 3": true,
                        "url 1": false,
                        "url 2": true,
                        "url 3": true
                      },
                      "includeByName": {},
                      "indexByName": {
                        "Time 1": 7,
                        "Time 2": 17,
                        "Time 3": 29,
                        "Value #Expiry": 4,
                        "Value #Status": 0,
                        "Value #Uptime": 5,
                        "__name__": 8,
                        "cluster 1": 9,
                        "cluster 2": 18,
                        "cluster 3": 30,
                        "env 1": 10,
                        "env 2": 19,
                        "env 3": 31,
                        "exporter 1": 11,
                        "exporter 2": 20,
                        "exporter 3": 32,
                        "group 1": 1,
                        "group 2": 21,
                        "group 3": 33,
                        "instance 1": 12,
                        "instance 2": 22,
                        "instance 3": 34,
                        "job 1": 13,
                        "job 2": 23,
                        "job 3": 35,
                        "key": 6,
                        "name 1": 2,
                        "name 2": 24,
                        "name 3": 36,
                        "pod 1": 14,
                        "pod 2": 25,
                        "pod 3": 37,
                        "source 1": 15,
                        "source 2": 26,
                        "source 3": 38,
                        "type 1": 16,
                        "type 2": 27,
                        "type 3": 39,
                        "url 1": 3,
                        "url 2": 28,
                        "url 3": 40
                      },
                      "renameByName": {
                        "Value #Expiry": "Expiry",
                        "Value #Status": "Status",
                        "Value #Uptime": "Uptime %",
                        "group 1": "Group",
                        "name 1": "Name",
                        "url 1": "Url"
                      }
                    }
                  }
                ],
                "type": "table"
              }
            ],
            "preload": false,
            "refresh": "",
            "schemaVersion": 41,
            "tags": [],
            "templating": {
              "list": []
            },
            "time": {
              "from": "now-6h",
              "to": "now"
            },
            "timepicker": {},
            "timezone": "",
            "title": "Gatus_Uptime",
            "uid": "gatus_uptime",
            "version": 1
          }

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
      - name: Mimir
        type: prometheus
        access: proxy
        url: http://mimir-nginx.monitoring.svc.cluster.local/prometheus
        isDefault: true
      - name: Tempo
        type: tempo
        access: proxy
        url: http://tempo.monitoring.svc.cluster.local:3100
        isDefault: false
      - name: Alertmanager
        type: alertmanager
        access: proxy
        url: http://mimir-nginx.monitoring.svc.cluster.local
        isDefault: false
        jsonData:
          implementation: mimir
          handleGrafanaManagedAlerts: false