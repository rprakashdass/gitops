# No PSP (removed in K8s 1.25) or SCC (OpenShift-only); skip chart RBAC and use default SA
rbac:
  create: false
kafka:
  enabled: false
minio:
  enabled: false
zoneAwareReplication:
  enabled: false

gateway:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      cpu: 50m
      memory: 64Mi

# Run without PVC dependencies; store long-term blocks in MinIO (S3)
ingester:
  replicas: 1
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 300m
      memory: 768Mi
  extraEnv:
    - name: POD_IP
      valueFrom:
        fieldRef: { fieldPath: status.podIP }

store_gateway:
  replicas: 1
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 150m
      memory: 256Mi
  extraEnv:
    - name: POD_IP
      valueFrom:
        fieldRef: { fieldPath: status.podIP }

compactor:
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

distributor:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraEnv:
    - name: POD_IP
      valueFrom:
        fieldRef: { fieldPath: status.podIP }

querier:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  extraEnv:
    - name: POD_IP
      valueFrom:
        fieldRef: { fieldPath: status.podIP }

query_frontend:
  replicas: 1
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  extraEnv:
    - name: POD_IP
      valueFrom:
        fieldRef: { fieldPath: status.podIP }

query_scheduler:
  replicas: 1
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  extraEnv:
    - name: POD_IP
      valueFrom:
        fieldRef: { fieldPath: status.podIP }

mimir:
  structuredConfig:
    blocks_storage:
      backend: s3
      s3:
        endpoint: minio.monitoring.svc.cluster.local:9000
        bucket_name: mimir-blocks
        access_key_id: loki
        secret_access_key: loki12345
        insecure: true

    # Single-replica lab: replication_factor 1 so ring accepts one healthy instance
    distributor:
      ring:
        instance_addr: ${POD_IP}
        instance_id: ${HOSTNAME}

    ingester:
      ring:
        instance_addr: ${POD_IP}
        instance_id: ${HOSTNAME}
        replication_factor: 1

    store_gateway:
      sharding_ring:
        instance_addr: ${POD_IP}
        instance_id: ${HOSTNAME}
        replication_factor: 1

    frontend_worker:
      frontend_address: "mimir-query-frontend-headless.monitoring.svc.cluster.local.:9095"

    alertmanager:
      data_dir: /data/alertmanager
      fallback_config_file: /etc/alertmanager/config/alertmanager.yaml

    ruler:
      rule_path: /var/mimir/ruler
      alertmanager_url: http://mimir-alertmanager.monitoring.svc.cluster.local:8080/alertmanager

    ruler_storage:
      backend: local
      local:
        directory: /rules

alertmanager:
  enabled: true
  extraVolumes:
  - name: alertmanager-config
    configMap:
      name: alertmanager-config
  - name: alertmanager-slack-secret
    secret:
      secretName: alertmanager-slack

  extraVolumeMounts:
  - name: alertmanager-config
    mountPath: /etc/alertmanager/config
    readOnly: true
  - name: alertmanager-slack-secret
    mountPath: /etc/alertmanager/secrets
    readOnly: true

ruler:
  enabled: true
  extraVolumes:
  - name: prometheus-rules
    configMap:
      name: prometheus-rules
  - name: ruler-tmp
    emptyDir: {}

  extraVolumeMounts:
  - name: prometheus-rules
    mountPath: /rules/anonymous
    readOnly: true
  - name: ruler-tmp
    mountPath: /var/mimir/ruler