mode: standalone

image:
  repository: coollabsio/minio
  tag: RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9

mcImage:
  repository: cgr.dev/chainguard/minio-client
  tag: latest-dev@sha256:a8a0480cb7356bf1c1f6e348b483a161c727a5c77ca574899e5a045686492bbe

nodeSelector:
  kubernetes.io/hostname: k3s.worker.1

rootUser: loki
rootPassword: loki12345

# Lower resources so MinIO can schedule on memory-constrained nodes
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 258Mi
    cpu: 300m

persistence:
  enabled: true
  size: 20Gi

# Create buckets Loki, Mimir, and Tempo will use
buckets:
  - name: loki-chunks
    policy: none
    purge: false
  - name: loki-admin
    policy: none
    purge: false
  - name: mimir-blocks
    policy: none
    purge: false
  - name: mimir-ruler
    policy: none
    purge: false
  - name: tempo
    policy: none
    purge: false

# Optional: enable console ingress
# consoleIngress:
#   enabled: true