mode: standalone

image:
  repository: coollabsio/minio
  tag: RELEASE.2025-10-15T17-29-55Z@sha256:69b55a1c1c5dc285ce04db96689f5b2102317fc77a50680a1874ca6efd1c87f9

mcImage:
  repository: cgr.dev/chainguard/minio-client
  tag: latest@sha256:5b759d9e248ad9f1ab8455f8168b86a47acb1e08207d38603b504bdc5a555d7a

nodeSelector:
  kubernetes.io/hostname: k3s.worker.1

rootUser: loki
rootPassword: loki12345

# Lower resources so MinIO can schedule on memory-constrained nodes
resources:
  requests:
    memory: 128Mi
    cpu: 100m
  limits:
    memory: 258Mi
    cpu: 300m

persistence:
  enabled: true
  size: 20Gi

# Create buckets Loki, Mimir, and Tempo will use
buckets:
  - name: loki-chunks
    policy: none
    purge: false
  - name: loki-admin
    policy: none
    purge: false
  - name: mimir-blocks
    policy: none
    purge: false
  - name: mimir-ruler
    policy: none
    purge: false
  - name: tempo
    policy: none
    purge: false

# Optional: enable console ingress
# consoleIngress:
#   enabled: true