{{- $defaultGitRepo := .Values.repository.url | default "https://github.com/rprakashdass/homelab-gitops.git" }}
{{- $defaultGitBranch := .Values.repository.branch | default "main" }}
{{- $argocdNamespace := .Values.argocdNamespace | default "argocd" }}
{{- $defaultDeployNamespace := .Values.deploymentNamespace | default "home" }}
{{- $defaultProject := .Values.argocdProject | default "home" }}

{{- range $name, $app := .Values.applications }}
{{- if $app.enabled }}
{{- $gitRepo := $app.repoURL | default $defaultGitRepo }}
{{- $gitBranch := $app.targetRevision | default $defaultGitBranch }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: {{ $argocdNamespace }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/component: argocd-application
    app.kubernetes.io/part-of: argocd
  annotations:
    app.kubernetes.io/description: {{ $app.description | default "" | quote }}
    argocd.argoproj.io/sync-wave: {{ $app.syncWave | default "0" | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $app.project | default $defaultProject }}

{{- if $app.sources }}
  sources:
{{ toYaml $app.sources | indent 4 }}
{{- else if $app.useExternalChart }}
  {{- if $app.externalChart.valueFile }}
  sources:
    - repoURL: {{ $app.externalChart.repoURL }}
      chart: {{ $app.externalChart.chart }}
      targetRevision: {{ $app.externalChart.targetRevision }}
      helm:
        releaseName: {{ $name }}
        valueFiles:
          - $values/{{ $app.externalChart.valueFile }}
    - repoURL: {{ $gitRepo }}
      targetRevision: {{ $gitBranch }}
      ref: values
  {{- else }}
  source:
    repoURL: {{ $app.externalChart.repoURL }}
    chart: {{ $app.externalChart.chart }}
    targetRevision: {{ $app.externalChart.targetRevision }}
    helm:
      releaseName: {{ $name }}
      {{- if $app.externalChart.values }}
      values: |
{{ $app.externalChart.values | indent 8 }}
      {{- end }}
  {{- end }}
{{- else }}
  source:
    repoURL: {{ $gitRepo }}
    targetRevision: {{ $gitBranch }}
    path: {{ $app.path }}
    {{- if $app.helm }}
    helm:
      releaseName: {{ $name }}
      {{- if $app.helm.valueFiles }}
      valueFiles:
        {{- range $app.helm.valueFiles }}
        - {{ . }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- if $app.directory }}
    directory:
      {{- if $app.directory.include }}
      include: {{ $app.directory.include | quote }}
      {{- end }}
      {{- if hasKey $app.directory "recurse" }}
      recurse: {{ $app.directory.recurse }}
      {{- end }}
    {{- end }}
{{- end }}

  destination:
    server: https://kubernetes.default.svc
    namespace: {{ $app.namespace | default $defaultDeployNamespace }}

  syncPolicy:
    {{- if or (not (hasKey $app "autoSync")) $app.autoSync }}
    automated:
      prune: {{ if hasKey $app "prune" }}{{ $app.prune }}{{ else }}true{{ end }}
      selfHeal: true
    {{- end }}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

---
{{- end }}
{{- end }}
