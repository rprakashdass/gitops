# ArgoCD Helm Chart Values
# Official chart: https://github.com/argoproj/argo-helm

global:
  domain: argocd.local

server:
  insecure: true

  service:
    port: 80

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: argocd.local
        paths:
          - path: /
            pathType: Prefix

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Controller configuration
# NOTE: the argo-cd chart expects resources under `.resources`, not directly
# under the component — the previous top-level requests/limits were ignored.
controller:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

repoServer:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Dex (SSO)
dex:
  enabled: false

# Application Set Controller
applicationSet:
  enabled: true

# Notifications Controller
notifications:
  enabled: false

configs:
  params:
    server.insecure: true

