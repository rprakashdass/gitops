# SOPS configuration for secrets encryption.
# Encrypts the data/stringData values of any *.enc.yaml file matching a rule.
#
#   Encrypt:  sops -e -i path/to/secret.enc.yaml
#   Decrypt:  sops -d path/to/secret.enc.yaml
#   Edit:     sops path/to/secret.enc.yaml
#   Apply:    sops -d path/to/secret.enc.yaml | kubectl apply -f -

creation_rules:
  # Central secrets store (e.g. secrets/telegram-bot-secrets.enc.yaml)
  - path_regex: 'secrets/.*\.enc\.yaml$'
    key_groups:
      - age:
          - age1p4u42ltpqj0jxpuhx47pm0dhpmuqw2x8utyrxsr6xrgnzx0slq7q9u5jcw

  # Secrets colocated with a service chart (services/<domain>/<name>/*.enc.yaml)
  - path_regex: 'services/.*\.enc\.yaml$'
    key_groups:
      - age:
          - age1p4u42ltpqj0jxpuhx47pm0dhpmuqw2x8utyrxsr6xrgnzx0slq7q9u5jcw
