apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pos-ingress
  namespace: pos
spec:
  ingressClassName: nginx
  rules:
    - host: pos.local
      http:
        paths:
          # Backend API routes - no rewrite needed, backend already has /api context
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pos-backend-service
                port:
                  number: 8082
          # Frontend routes (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pos-frontend-service
                port:
                  number: 3000
