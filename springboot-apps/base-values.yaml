mysql:
  replicas: 1
  database: posdb
  auth:
    username: root
    password: rootpass
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "500m"
      memory: "512Mi"
    requests:
      cpu: "250m"
      memory: "256Mi"
  persistence:
    size: 500Mi

config:
  database:
    url: "jdbc:mysql://pos-db-service:3306/posdb"
  jpa:
    hibernate_ddl_auto: "validate"
    show_sql: "false"
  api:
    base_url: "/api"
  otel:
    exporter:
      otlp:
        endpoint: "http://alloy-receiver.observability.svc.cluster.local:4317"
        protocol: "grpc"
    service_name: "pos-backend"

serviceAccount:
  create: false
  name: pos-sa

CreateNamespace: true
