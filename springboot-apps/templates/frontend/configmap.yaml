{{- if .Values.global.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: pos-frontend-config
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "pos.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
data:
  NEXT_PUBLIC_API_BASE_URL: {{ .Values.config.api.base_url | quote }}
{{- end }}
