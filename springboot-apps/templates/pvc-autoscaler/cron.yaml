apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-autoscaler
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "pos.commonLabels" . | nindent 4 }}
spec:
  schedule: {{ .Values.pvcAutoscaler.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: pvc-autoscaler
        spec:
          serviceAccountName: {{ .Values.pvcAutoscaler.name }}
          restartPolicy: OnFailure
          volumes:
            - name: script
              configMap:
                name: pvc-autoscaler-script
                defaultMode: 0755
          containers:
            - name: pvc-autoscaler
              image: {{ .Values.pvcAutoscaler.image.repository }}:{{ .Values.pvcAutoscaler.image.tag }}
              command:
                - /bin/sh
                - -c
                - |
                  pip install kubernetes --quiet && \
                  python /scripts/pvc_usage.py
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
              volumeMounts:
                - name: script
                  mountPath: /scripts
              resources:
                limits:
                  cpu: "100m"
                  memory: "128Mi"
                requests:
                  cpu: "50m"
                  memory: "64Mi"
{{- end }}
