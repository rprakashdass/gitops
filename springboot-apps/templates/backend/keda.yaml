{{- if .Values.backend.autoscaling.enabled }}
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: pos-backend-scaledobject
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "pos.commonLabels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pos-backend
  minReplicaCount: {{ .Values.backend.autoscaling.minReplicaCount }}
  maxReplicaCount: {{ .Values.backend.autoscaling.maxReplicaCount }}
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "{{ .Values.backend.autoscaling.cpuAverageUtilization }}"
    - type: memory
      metricType: Utilization
      metadata:
        value: "{{ .Values.backend.autoscaling.memoryAverageUtilization }}"
  {{- if .Values.backend.autoscaling.behavior }}
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        {{- toYaml .Values.backend.autoscaling.behavior | nindent 8 }}
  {{- end }}
{{- end }}
