global:
  enabled: true
  environment: dev
  namespace: pos

backend:
  replicas: 2
  image:
    tag: latest
    pullPolicy: Always

  resources:
    requests:
      cpu: "50m"
      memory: "128Mi"

  autoscaling:
    enabled: false

frontend:
  replicas: 1
  image:
    tag: latest
    pullPolicy: Always

  resources:
    requests:
      cpu: "100m"
      memory: "250Mi"

  autoscaling:
    enabled: false

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  persistence:
    size: 200Mi

config:
  jpa:
    hibernate_ddl_auto: "create-drop"
    show_sql: "true"
  otel:
    exporter:
      otlp:
        endpoint: "http://alloy.monitoring.svc.cluster.local:4317"
    service:
      name: "pos-system"
  java_tool_options: "-javaagent:/app/otel-javaagent.jar otel.javaagent.debug=true"