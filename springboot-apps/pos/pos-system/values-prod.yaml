global:
  enabled: true
  environment: prod
  namespace: pos-prod
  domain: pos.local

backend:
  replicas: 3
  image:
    tag: latest

  resources:
    requests:
      cpu: "200m"
      memory: "250Mi"

  probes:
    port: 8082
    startup:
      initialDelaySeconds: 90

  autoscaling:
    enabled: false

frontend::
  replicas: 2
  image:
    tag: latest

  resources:
    requests:
      cpu: "100m"
      memory: "150Mi"

  autoscaling:
    enabled: false

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  persistence:
    size: 400Mi

config:
  jpa:
    hibernate_ddl_auto: "validate"
    show_sql: "true"
  otel:
    exporter:
      otlp:
        endpoint: "http://alloy-receiver.monitoring.svc.cluster.local:4317"
    service_name: "pos-backend-prod"
  java_tool_options: "-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.javaagent.debug=false"