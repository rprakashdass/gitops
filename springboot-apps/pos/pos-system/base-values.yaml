global:
  enabled: false
  namespace: pos
  environment: dev
  domain: pos.local

backend:
  replicas: 1
  image:
    repository: docker.io/rprakashdass/pos-backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "200m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    cpuAverageUtilization: 70
    memoryAverageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policy:
          type: Percent
          value: 50
          periodSeconds: 15
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 2
            periodSeconds: 15
  probes:
    port: 8082
    path: /api/health
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 30    # 30 * 10s = 5 min max startup window
    readiness:
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3     # fail fast, just pulls from LB
    liveness:
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6     # conservative, avoids thrashing restarts

frontend:
  replicas: 3
  image:
    repository: docker.io/rprakashdass/pos-frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "200m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    cpuAverageUtilization: 70
    memoryAverageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policy:
          type: Percent
          value: 50
          periodSeconds: 15
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 2
            periodSeconds: 15

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent

config:
  database:
    url: "jdbc:mysql://pos-db-service:3306/posdb"
  jpa:
    hibernate_ddl_auto: "validate"
    show_sql: "false"
  api:
    base_url: "/api"

CreateNamespace: true