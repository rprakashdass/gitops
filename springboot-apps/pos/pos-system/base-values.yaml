global:
  enabled: false
  namespace: pos
  env: dev
  domain: pos.local

backend:
  replicas: 1
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: 1
  image:
    repository: docker.io/rprakashdass/pos-backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "200m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  autoscaling:
    enabled: false
    minReplicaCount: 2
    maxReplicaCount: 10
    cpuAverageUtilization: 70
    memoryAverageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 50
            periodSeconds: 15
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 2
            periodSeconds: 15
  probes:
    port: 8082
    path: /api/health
    startup:
      initialDelaySeconds: 60
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 30    # 30 * 10s = 5 min max startup window
    readiness:
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3     # fail fast, just pulls from LB
    liveness:
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 6     # conservative, avoids thrashing restarts
  envs:
    SPRING_PROFILES_ACTIVE: "prod"
    JAVA_XMS: "224m"
    JAVA_XMX: "300m"
    JAVA_MAX_THREADS: "500"
    JAVA_GC_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200"
    JAVA_TOOL_OPTIONS: "-javaagent:/otel/opentelemetry-javaagent.jar -Dotel.javaagent.debug=false"
    OTEL_RESOURCE_ATTRIBUTES: "env=prod,service.version=latest"

frontend:
  replicas: 3
  pdb:
    enabled: true
    minAvailable: 1
    maxUnavailable: 1
  image:
    repository: docker.io/rprakashdass/pos-frontend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: "200m"
      memory: "512Mi"
    requests:
      cpu: "100m"
      memory: "256Mi"
  autoscaling:
    enabled: false
    minReplicaCount: 2
    maxReplicaCount: 8
    cpuAverageUtilization: 70
    memoryAverageUtilization: 80
    behavior:
      scaleDown:
        stabilizationWindowSeconds: 300
        policies:
          - type: Percent
            value: 50
            periodSeconds: 15
      scaleUp:
        stabilizationWindowSeconds: 0
        selectPolicy: Max
        policies:
          - type: Percent
            value: 100
            periodSeconds: 15
          - type: Pods
            value: 2
            periodSeconds: 15

mysql:
  image:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent

config:
  database:
    url: "jdbc:mysql://pos-db-service:3306/posdb"
  jpa:
    hibernate_ddl_auto: "validate"
    show_sql: "false"
  api:
    base_url: "/api"

CreateNamespace: true