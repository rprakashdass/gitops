{{- if .Values.global.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pos-ingress
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.global.domain }}
      http:
        paths:
          # Backend API routes - no rewrite needed, backend already has /api context
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: pos-backend-service
                port:
                  number: 8082
          # Frontend routes (catch-all)
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pos-frontend-service
                port:
                  number: 3000
{{- end }}
